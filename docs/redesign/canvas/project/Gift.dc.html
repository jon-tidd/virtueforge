<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Give a year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1F1A14;-webkit-font-smoothing:antialiased}
a{color:#8A5212;text-decoration:none} a:hover{color:#6B3E0C}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.story{font-family:'Literata',Georgia,serif}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:999px;background:#E9A23B;color:#16203A;font-weight:700;font-size:16.5px;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#F2B559;color:#16203A}
.plan{flex:1;text-align:left;border-radius:20px;border:2px solid #E7DCC7;background:#FFFCF5;padding:14px;cursor:pointer;font-family:'Figtree',sans-serif;color:#1F1A14}
.lbl{font-size:12px;font-weight:800;letter-spacing:.12em;color:#6A5D4B;margin-top:16px}
.field{margin-top:8px;min-height:50px;border-radius:14px;border:1.5px solid #E2D5BC;background:#FFFCF5;padding:0 14px;font:500 16px 'Figtree',sans-serif;color:#1F1A14;box-sizing:border-box;width:100%}
.occ{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #D8C9AB;background:#FFFCF5;font:700 13.5px 'Figtree',sans-serif;color:#4A4034;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1100px;background:#F7F1E5;display:flex;flex-direction:column;box-sizing:border-box;padding:0 20px 22px">
  <div style="display:flex;align-items:center;padding:10px 0">
    <a href="ReadAlong.dc.html" aria-label="Back" style="color:#4A4034;min-height:44px;min-width:44px;display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </div>
  <div style="position:relative;height:170px;border-radius:22px;background:#16203A;overflow:hidden;display:flex;align-items:center;justify-content:center">
    <svg width="350" height="170" viewBox="0 0 350 170" aria-hidden="true" style="position:absolute;inset:0"><g fill="#E9A23B"><circle cx="30" cy="30" r="2"/><circle cx="320" cy="40" r="1.6"/><circle cx="60" cy="140" r="1.4"/><circle cx="300" cy="130" r="2"/><path d="M280 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M70 60l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z"/></g></svg>
    <div style="position:relative;width:200px;height:118px;background:#F4EAD5;border-radius:8px;box-shadow:0 14px 28px rgba(0,0,0,.35);transform:rotate(-3deg)">
      <svg width="200" height="118" viewBox="0 0 200 118" aria-hidden="true" style="position:absolute;inset:0"><path d="M0 0l100 64L200 0" fill="none" stroke="#D8C9AB" stroke-width="2"/></svg>
      <div style="position:absolute;left:50%;top:50px;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:#B8452E;display:flex;align-items:center;justify-content:center"><svg width="16" height="20" viewBox="0 0 22 26" fill="none" stroke="#F4EAD5" stroke-width="2" aria-hidden="true"><path d="M8 2h6M11 2v3M6 7h10l-1.2 13H7.2zM5 21h12v3H5z"/></svg></div>
    </div>
  </div>
  <div class="eyebrow" style="color:#8A5212;margin-top:18px">A gift that shows up every night</div>
  <h1 class="disp" style="margin:6px 0 0;font-size:32px;line-height:1.08;font-weight:600">Give a year of stories.</h1>
  <p style="margin:8px 0 0;font-size:14.5px;line-height:1.5;color:#4A4034">They draw the kids in. You can record chapters in your voice from anywhere.</p>
  <div style="display:flex;gap:10px;margin-top:14px">
    <sc-for list="{{plans}}" as="p" hint-placeholder-count="2"><button class="plan" onClick="{{p.pick}}" style="{{p.style}}"><span style="display:block;font-weight:800;font-size:15px">{{p.name}}</span><span class="disp" style="display:block;font-size:26px;font-weight:600;margin-top:4px">{{p.price}}</span><span style="display:block;font-size:12.5px;color:#6A5D4B;margin-top:4px;line-height:1.35">{{p.note}}</span></button></sc-for>
  </div>
  <label class="lbl" for="to">WHO IS IT FOR?</label>
  <input id="to" class="field" value="Jon and the kids (jon@…)">
  <div class="lbl">WHEN SHOULD IT ARRIVE?</div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
    <sc-for list="{{occasions}}" as="o" hint-placeholder-count="3"><button class="occ" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for>
  </div>
  <label class="lbl" for="msg">YOUR NOTE</label>
  <textarea id="msg" style="margin-top:8px;min-height:76px;border-radius:14px;border:1.5px solid #E2D5BC;background:#FFFCF5;padding:12px 14px;font:italic 400 16px/1.5 'Literata',serif;color:#1F1A14;box-sizing:border-box;width:100%;resize:none">For my three brave ones. I'll be reading along. Love, Grandma</textarea>
  <div style="flex-grow:1"></div>
  <a class="btn" href="ShareMessage.dc.html">Give it · {{total}}</a>
  <div style="text-align:center;font-size:13px;color:#6A5D4B;margin-top:10px">No auto-renew on gifts. The family decides after the year.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { plan: 'Heirloom', occ: 'Christmas morning' }; }
  renderVals() {
    const plans = [
      { name: 'Family', price: '$49', note: 'A new chapter each night they read, every child' },
      { name: 'Heirloom', price: '$89', note: 'Plus the family story voice and a yearly hardcover' }
    ];
    const on = { borderColor: '#E9A23B', background: '#FBF1DC' };
    const dark = { background: '#16203A', borderColor: '#16203A', color: '#F4E9D2' };
    return {
      plans: plans.map((p) => ({ ...p, style: this.state.plan === p.name ? on : {}, pick: () => this.setState({ plan: p.name }) })),
      occasions: ['Right now', 'Clara’s birthday', 'Christmas morning'].map((label) => ({ label, style: this.state.occ === label ? dark : {}, pick: () => this.setState({ occ: label }) })),
      total: this.state.plan === 'Heirloom' ? '$89' : '$49'
    };
  }
}
</script>
</body>
</html>
