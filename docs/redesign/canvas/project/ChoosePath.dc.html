<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The kids choose the path</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#E9A23B;text-decoration:none} a:hover{color:#F2B559}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border-radius:24px;border:2px solid #3A2C1A;background:#211810;color:#EAD9BC;padding:20px;cursor:pointer;text-align:left;font-family:'Figtree',sans-serif}
</style>
</helmet>
<div style="width:390px;height:900px;background:#150F0A;color:#EAD9BC;display:flex;flex-direction:column;box-sizing:border-box;padding:22px 20px 20px">
  <div class="eyebrow" style="color:#E9A23B;text-align:center">You decide</div>
  <h1 class="disp" style="margin:10px 0 0;font-size:32px;line-height:1.1;font-weight:600;text-align:center;color:#FBF0DA">On the far side, the road splits in two. Where should the heroes go tomorrow?</h1>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:22px">
    <button class="opt" onClick="{{pickCave}}" style="{{caveStyle}}">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 40c4-14 10-24 20-24s16 10 20 24z"/><path d="M16 40c1-7 4-11 8-11s7 4 8 11"/><path d="M34 10l2-4M38 14l4-2M30 8l0-4"/></svg>
      <span class="disp" style="font-size:22px;font-weight:600">Down to the cave, where something sneezed</span>
      <span style="font-size:14px;opacity:.8">Max's idea is waiting there…</span>
    </button>
    <button class="opt" onClick="{{pickTower}}" style="{{towerStyle}}">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M18 44l3-28h6l3 28z"/><path d="M17 16h14l-2-6H19z"/><path d="M24 4v4M10 12l-4-2M38 12l4-2"/></svg>
      <span class="disp" style="font-size:22px;font-weight:600">Up to the lighthouse on the cliff</span>
      <span style="font-size:14px;opacity:.8">Its light went out last night.</span>
    </button>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px">
    <img src="/_blob/49c6eb96321a54a534a7d5155073c868" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;display:block">
    <img src="/_blob/a40cd22c8b0131f6f805efbdc3aca9a8" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;display:block">
    <img src="/_blob/89224e240d4677b215293a2283578be4" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;display:block">
    <span style="font-size:13.5px;color:#C9B89A">Everybody votes. Majority wins.</span>
  </div>
  <div style="flex-grow:1"></div>
  <a href="LastPage.dc.html" style="min-height:56px;border-radius:999px;background:#E9A23B;color:#150F0A;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'cave' }; }
  renderVals() {
    const on = { borderColor: '#E9A23B', background: '#2E2112', color: '#FBF0DA' };
    const p = this.state.pick;
    return {
      pickCave: () => this.setState({ pick: 'cave' }),
      pickTower: () => this.setState({ pick: 'tower' }),
      caveStyle: p === 'cave' ? on : {},
      towerStyle: p === 'tower' ? on : {},
      cta: p === 'cave' ? 'To the cave! Finish the chapter' : 'To the lighthouse! Finish the chapter'
    };
  }
}
</script>
</body>
</html>
