<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set bedtime</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1F1A14;-webkit-font-smoothing:antialiased}
a{color:#8A5212;text-decoration:none} a:hover{color:#6B3E0C}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6A5D4B}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:999px;background:#E9A23B;color:#16203A;font-weight:700;font-size:16.5px;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#F2B559;color:#16203A}
.day{width:44px;height:44px;border-radius:50%;border:1.5px solid #E2D5BC;background:#FFFCF5;font:700 14px 'Figtree',sans-serif;color:#3B3226;cursor:pointer}
.mode{display:flex;align-items:center;gap:12px;min-height:60px;border-radius:16px;border:1.5px solid #E2D5BC;background:#FFFCF5;padding:0 14px;font:600 15px 'Figtree',sans-serif;color:#1F1A14;cursor:pointer;text-align:left}
</style>
</helmet>
<div style="width:390px;height:1000px;background:#F7F1E5;display:flex;flex-direction:column;box-sizing:border-box;padding:0 20px 24px">
  <div style="display:flex;align-items:center;padding:10px 0">
    <a href="SaveFamily.dc.html" aria-label="Back" style="color:#4A4034;min-height:44px;min-width:44px;display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </div>
  <h1 class="disp" style="margin:8px 0 0;font-size:34px;line-height:1.06;font-weight:600">When's story time?</h1>
  <p style="margin:10px 0 0;font-size:15px;line-height:1.5;color:#4A4034">We'll have tonight's chapter ready and send one gentle nudge.</p>
  <div style="margin-top:22px;background:#16203A;color:#FBF3E2;border-radius:22px;padding:18px;display:flex;align-items:center;justify-content:space-between">
    <div><div class="lbl" style="color:#A99F8C">Story time</div><div class="disp" style="font-size:44px;font-weight:600;line-height:1">7:30<span style="font-size:20px"> pm</span></div></div>
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="1.5" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </div>
  <div class="lbl" style="margin-top:18px">Which nights?</div>
  <div style="display:flex;justify-content:space-between;margin-top:8px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button class="day" onClick="{{d.pick}}" style="{{d.style}}" aria-label="{{d.full}}">{{d.label}}</button></sc-for>
  </div>
  <div style="margin-top:12px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:#3F5739;background:#E7EEDD;border-radius:14px;padding:12px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink:0;margin-top:1px"><path d="M5 12l5 5L20 7"/></svg>
    <span>Five nights is a great week. Miss one? Nothing breaks, and the story waits.</span>
  </div>
  <div class="lbl" style="margin-top:20px">How will you usually read?</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button class="mode" onClick="{{m.pick}}" style="{{m.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"/></svg><span style="flex:1"><span style="display:block">{{m.label}}</span><span style="display:block;font-size:12.5px;font-weight:500;opacity:.8">{{m.sub}}</span></span></button>
    </sc-for>
  </div>
  <div style="flex-grow:1"></div>
  <a class="btn" href="Tonight.dc.html">All set</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { days: { Su: true, M: true, Tu: true, W: true, Th: true }, mode: 'Read aloud from my phone' }; }
  renderVals() {
    const on = { background: '#16203A', borderColor: '#16203A', color: '#F4E9D2' };
    const names = [['Su', 'Sunday'], ['M', 'Monday'], ['Tu', 'Tuesday'], ['W', 'Wednesday'], ['Th', 'Thursday'], ['F', 'Friday'], ['Sa', 'Saturday']];
    const days = names.map(([label, full]) => ({ label, full, style: this.state.days[label] ? on : {}, pick: () => this.setState({ days: { ...this.state.days, [label]: !this.state.days[label] } }) }));
    const modes = [
      { label: 'Read aloud from my phone', sub: 'Dim nightlight mode, facing you', icon: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z M4 19a2 2 0 0 1 2-2h13' },
      { label: 'Print the week on Sunday', sub: 'Fold-and-staple booklet, no screen', icon: 'M7 9V3h10v6 M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2 M7 14h10v7H7z' },
      { label: 'Play the audio', sub: 'Your recorded voice, or a narrator', icon: 'M4 15v-3a8 8 0 0 1 16 0v3 M4 15h3v6H4z M17 15h3v6h-3z' }
    ].map((m) => ({ ...m, style: this.state.mode === m.label ? on : {}, pick: () => this.setState({ mode: m.label }) }));
    return { days, modes };
  }
}
</script>
</body>
</html>
