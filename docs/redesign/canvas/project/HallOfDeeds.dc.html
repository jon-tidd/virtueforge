<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hall of Deeds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1F1A14;-webkit-font-smoothing:antialiased}
a{color:#8A5212;text-decoration:none} a:hover{color:#6B3E0C}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.story{font-family:'Literata',Georgia,serif}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #D8C9AB;background:#FFFCF5;font:700 14px 'Figtree',sans-serif;color:#4A4034;cursor:pointer}
.plaque{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:6px 20px 20px 6px;background:#F4EAD5;box-shadow:0 8px 18px rgba(60,40,10,.1)}
.plaque img{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;flex-shrink:0;border:3px solid #E9A23B}
</style>
</helmet>
<div style="width:390px;height:1000px;background:#F7F1E5;display:flex;flex-direction:column;box-sizing:border-box;padding:0 20px 22px">
  <div style="display:flex;align-items:center;padding:10px 0">
    <a href="Shield.dc.html" aria-label="Back" style="color:#4A4034;min-height:44px;min-width:44px;display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </div>
  <div style="text-align:center">
    <svg width="64" height="40" viewBox="0 0 64 40" fill="none" stroke="#B87718" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M32 6c-8 10-8 22 0 30 8-8 8-20 0-30zM20 16c-8 2-12 10-10 18 8 0 12-6 12-12M44 16c8 2 12 10 10 18-8 0-12-6-12-12"/></svg>
    <div class="eyebrow" style="color:#8A5212">As told in Brindlewick</div>
    <h1 class="disp" style="margin:6px 0 0;font-size:36px;line-height:1.05;font-weight:600">The Hall of Deeds</h1>
    <p style="margin:8px 0 0;font-size:14.5px;line-height:1.5;color:#4A4034">Real things your kids did, told as legends. Nine so far.</p>
  </div>
  <div style="display:flex;gap:8px;margin-top:16px;justify-content:center">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button class="chip" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
    <sc-for list="{{deeds}}" as="d" hint-placeholder-count="4">
      <div class="plaque"><img src="{{d.img}}" alt="{{d.who}}"><div style="flex:1"><div class="disp" style="font-size:18px;font-weight:600;color:#6B3E0C">{{d.title}}</div><div class="story" style="font-size:14.5px;line-height:1.5;color:#2A2118;margin-top:4px">{{d.text}}</div><div style="font-size:12px;font-weight:700;color:#8A7A60;margin-top:6px">{{d.when}}</div></div></div>
    </sc-for>
  </div>
  <div style="flex-grow:1"></div>
  <a href="Hardcover.dc.html" style="min-height:56px;border-radius:999px;background:#16203A;color:#F4E9D2;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M5 17a3 3 0 0 1 3-3h11"/></svg>Every legend goes in the hardcover</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { who: 'All' }; }
  renderVals() {
    const T = '/_blob/49c6eb96321a54a534a7d5155073c868', J = '/_blob/a40cd22c8b0131f6f805efbdc3aca9a8', M = '/_blob/89224e240d4677b215293a2283578be4';
    const all = [
      { who: 'Theo', img: T, title: 'Theo of the Lantern', text: 'Spoke the truth about the broken lamp before anyone asked.', when: 'Week 6 · Courage' },
      { who: 'Max', img: M, title: 'Max Who Climbed', text: 'Went down the big slide with shaky knees, and then went again.', when: 'Week 6 · Courage' },
      { who: 'June', img: J, title: 'June the Bold Voice', text: 'Shared her idea at dinner when the big kids were talking.', when: 'Week 5 · Courage' },
      { who: 'Theo', img: T, title: 'Theo the Steady', text: 'Finished his whole reading log, even the boring page.', when: 'Week 4 · Perseverance' },
      { who: 'June', img: J, title: 'June Who Shared', text: 'Gave Max the last strawberry without being asked.', when: 'Week 3 · Generosity' }
    ];
    const on = { background: '#16203A', borderColor: '#16203A', color: '#F4E9D2' };
    const list = this.state.who === 'All' ? all.slice(0, 4) : all.filter((d) => d.who === this.state.who);
    return {
      filters: ['All', 'Theo', 'June', 'Max'].map((label) => ({ label, style: this.state.who === label ? on : {}, pick: () => this.setState({ who: label }) })),
      deeds: list
    };
  }
}
</script>
</body>
</html>
