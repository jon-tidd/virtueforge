<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Car and dinner questions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1F1A14;-webkit-font-smoothing:antialiased}
a{color:#8A5212;text-decoration:none} a:hover{color:#6B3E0C}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tabb{flex:1;min-height:44px;border-radius:999px;border:none;font:700 13.5px 'Figtree',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F7F1E5;display:flex;flex-direction:column;box-sizing:border-box;padding:0 20px 22px">
  <div style="display:flex;align-items:center;padding:10px 0">
    <a href="SundayPlan.dc.html" aria-label="Back" style="color:#4A4034;min-height:44px;min-width:44px;display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </div>
  <div class="eyebrow" style="color:#8A5212">Talk about it · week 6</div>
  <h1 class="disp" style="margin:8px 0 0;font-size:34px;line-height:1.06;font-weight:600">Questions for the in-between moments.</h1>
  <div style="display:flex;gap:4px;margin-top:18px;background:#EFE4CE;border-radius:999px;padding:4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button class="tabb" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
  </div>
  <div style="position:relative;margin-top:20px;height:420px">
    <div style="position:absolute;left:16px;right:-8px;top:18px;bottom:-10px;border-radius:28px;background:#E3D2AE;transform:rotate(3deg)"></div>
    <div style="position:absolute;inset:0;border-radius:28px;background:#16203A;color:#FBF3E2;padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 36px rgba(20,20,40,.22)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow" style="color:#E9A23B">{{where}}</span><span style="font-size:13px;color:#A99F8C;font-weight:700">1 of 3</span></div>
      <div class="disp" style="font-size:31px;line-height:1.2;font-weight:500">{{q}}</div>
      <div style="font-size:14px;line-height:1.5;color:#C9C0AE">{{tip}}</div>
    </div>
  </div>
  <div style="flex-grow:1"></div>
  <div style="font-size:13.5px;line-height:1.5;color:#6A5D4B;text-align:center">New cards every Sunday. They arrive in the week's email too, so there's no need to open the app.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'In the car' }; }
  renderVals() {
    const cards = {
      'In the car': { q: '“What’s one hard thing you kept going at today?”', tip: 'Go first with your own answer. Kids copy what we share.' },
      'At dinner': { q: '“If you had the lantern, where would you go first?”', tip: 'Let Alfie answer first. If he gets stuck, give him time to say ‘not yet’ and try another answer. It’s his mission this week.' },
      'At bath time': { q: '“What helps you when your knees start shaking?”', tip: 'Practice the lantern breath: so soft the bubbles barely move.' }
    };
    const on = { background: '#16203A', color: '#F4E9D2' };
    const off = { background: 'transparent', color: '#4A4034' };
    const c = cards[this.state.tab];
    return {
      tabs: Object.keys(cards).map((label) => ({ label, style: this.state.tab === label ? on : off, pick: () => this.setState({ tab: label }) })),
      where: this.state.tab, q: c.q, tip: c.tip
    };
  }
}
</script>
</body>
</html>
