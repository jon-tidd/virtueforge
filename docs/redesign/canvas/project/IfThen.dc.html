<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1F1A14;-webkit-font-smoothing:antialiased}
a{color:#8A5212;text-decoration:none} a:hover{color:#6B3E0C}
.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.story{font-family:'Literata',Georgia,serif}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:999px;background:#E9A23B;color:#16203A;font-weight:700;font-size:16.5px;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#F2B559;color:#16203A}
.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-radius:20px;border:2.5px solid #E2D5BC;background:#FFFCF5;cursor:pointer;font:700 13.5px/1.25 'Figtree',sans-serif;color:#1F1A14;padding:10px 6px;text-align:center}
.lab{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.1em;margin-top:18px}
.num{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:14px}
</style>
</helmet>
<div style="width:390px;height:1040px;background:#F7F1E5;display:flex;flex-direction:column;box-sizing:border-box;padding:0 20px 22px">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0">
    <a href="LastPage.dc.html" aria-label="Back" style="color:#4A4034;min-height:44px;min-width:44px;display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#6A5D4B"><img src="/_blob/89224e240d4677b215293a2283578be4" alt="" style="width:30px;height:30px;border-radius:50%;object-fit:cover;display:block">Alfie's turn</span>
    <span style="width:44px"></span>
  </div>
  <div class="eyebrow" style="color:#8A5212">Kids tap, grown-ups read aloud</div>
  <h1 class="disp" style="margin:6px 0 0;font-size:34px;line-height:1.05;font-weight:600">Make your plan!</h1>
  <div class="lab" style="color:#8A5212"><span class="num" style="background:#16203A;color:#E9A23B">1</span>WHEN…</div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px">
    <sc-for list="{{whens}}" as="w" hint-placeholder-count="3"><button class="pc" onClick="{{w.pick}}" style="{{w.style}}"><span style="{{w.ic}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFCF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.d}}"/></svg></span>{{w.label}}</button></sc-for>
  </div>
  <div class="lab" style="color:#3F5739"><span class="num" style="background:#4E6A45;color:#F4E9D2">2</span>I WILL…</div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px">
    <sc-for list="{{wills}}" as="w" hint-placeholder-count="3"><button class="pc" onClick="{{w.pick}}" style="{{w.style}}"><span style="{{w.ic}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFCF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.d}}"/></svg></span>{{w.label}}</button></sc-for>
  </div>
  <div style="margin-top:20px;position:relative;border-radius:8px 24px 24px 8px;background:#16203A;color:#FBF3E2;padding:20px 18px 18px;box-shadow:0 16px 30px rgba(20,20,40,.2)">
    <div class="eyebrow" style="color:#E9A23B">Alfie's plan</div>
    <div class="story" style="font-size:22px;line-height:1.4;margin-top:6px">When <span style="color:#F2B559">{{when}}</span>, I will <span style="color:#B9D3A6">{{will}}</span>.</div>
    <div style="font-size:13px;color:#B8AE9A;margin-top:10px">Say it together three times, with the move.</div>
  </div>
  <div style="flex-grow:1"></div>
  <a class="btn" href="FridgeCard.dc.html">Put it on the fridge card</a>
  <div style="text-align:center;font-size:12.5px;line-height:1.45;color:#6A5D4B;margin-top:10px">Ember will remind Alfie of his plan in Thursday's chapter (Ch. 29 · Not Yet).</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { w: 2, x: 2 }; }
  renderVals() {
    const whens = [
      { label: 'It feels too big', text: 'it feels too big', c: '#C98A2B', d: 'M2 20l7-12 4 6 3-4 6 10z' },
      { label: 'It doesn’t work', text: 'it doesn’t work the first time', c: '#3E6A8E', d: 'M6 20h8v-5H6zM8 15h6v-5H8zM11 10h5V5h-5z' },
      { label: 'I want to quit', text: 'I want to quit', c: '#8A6A9A', d: 'M12 4v11M7 10l5 5 5-5M5 20h14' }
    ];
    const wills = [
      { label: 'Take a lantern breath', text: 'take a lantern breath and try one more time', c: '#4E6A45', d: 'M10 3h4M12 3v2M8 7h8l-1 11H9zM7 20h10' },
      { label: 'Do the next small step', text: 'do just the next small step', c: '#4E6A45', d: 'M3 20h5v-5h5v-5h5V5h3' },
      { label: 'Say “not yet!”', text: 'say “not yet!” and try a new way', c: '#4E6A45', d: 'M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5' }
    ];
    const card = (sel, c) => sel ? { borderColor: c, background: '#FFF6E2', boxShadow: '0 8px 16px rgba(60,40,10,.14)', transform: 'translateY(-2px)' } : {};
    const ic = (c) => ({ width: '42px', height: '42px', borderRadius: '50%', background: c, display: 'flex', alignItems: 'center', justifyContent: 'center' });
    return {
      whens: whens.map((w, i) => ({ label: w.label, d: w.d, ic: ic(w.c), style: card(this.state.w === i, w.c), pick: () => this.setState({ w: i }) })),
      wills: wills.map((w, i) => ({ label: w.label, d: w.d, ic: ic(w.c), style: card(this.state.x === i, w.c), pick: () => this.setState({ x: i }) })),
      when: whens[this.state.w].text, will: wills[this.state.x].text
    };
  }
}
</script>
</body>
</html>
